name: Driver Unit Tests (offline)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  discovery-and-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install driver
        run: python -m pip install -e .
      - name: Offline deterministic unit tests (90s watchdog)
        run: timeout 90s python -m unittest discover -s tests -v
